name: BlueSky Architecture Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '02_ARCHITECTURE/**'
      - '.github/workflows/architecture-validation.yml'
  pull_request:
    paths:
      - '02_ARCHITECTURE/**'
      - '.github/workflows/architecture-validation.yml'

jobs:
  architecture-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate architecture document integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("02_ARCHITECTURE")
          required = [
              "BLUESKY_OPERATIONAL_ORCHESTRATOR_ENERGY_POLICY_BASELINE.md",
              "BLUESKY_END_TO_END_OPERATIONAL_LIFECYCLE_BASELINE.md",
              "BLUESKY_ARCHITECTURE_GAP_MATRIX.md",
          ]

          for name in required:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Missing required architecture baseline: {path}")
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit(f"Empty architecture baseline: {path}")
              if not text.startswith("# "):
                  raise SystemExit(f"Missing top-level heading: {path}")
              if not re.search(r"(?im)^\*\*Status:\*\*", text):
                  raise SystemExit(f"Missing Status metadata: {path}")

          anchors = {
              required[0]: ("Operational Orchestrator", "Energy"),
              required[1]: ("Canonical lifecycle", "Operational orchestration overlay", "Definition of Done"),
              required[2]: ("End-to-end control chain", "Current GAP classification", "Remaining P0 implementation gaps"),
          }

          for name, needles in anchors.items():
              text = (root / name).read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(
                      f"Architecture baseline structural integrity failure in {name}: {', '.join(missing)}"
                  )

          print("Architecture documentation integrity: PASS")
          PY

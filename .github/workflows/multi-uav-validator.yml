name: Multi-UAV Validator

on:
  pull_request:
    branches: [main, integration/architecture-2026-10-04]
  push:
    branches: [main]

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r schemas/validator/requirements.txt

      - name: Compile validator sources
        run: python -m compileall -q schemas/validator

      - name: Run validator regression scripts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/schemas/validator"
          for test in schemas/validator/test_*.py; do
            echo "=== RUN $test ==="
            python "$test"
          done

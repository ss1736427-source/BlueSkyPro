name: BlueSky PRO HMI Qt Build

on:
  push:
    branches:
      - feat/hmi-controlled-cleanup-001
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  pull_request:
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  workflow_dispatch:

jobs:
  build-hmi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qtwebengine qtwebchannel qtpositioning'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

  build-hmi-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtwebengine qtwebchannel qtpositioning'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Deploy Windows runtime
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir qml --webengine build-windows\Release\appBlueSkyPRO.exe

      - name: Windows startup smoke test
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build-windows\Release\appBlueSkyPRO.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            throw "BlueSky PRO exited during startup smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: BlueSkyPRO-Windows-x64
          path: qt/BlueSkyPRO-HMI/build-windows/Release/
          if-no-files-found: error

name: BlueSky PRO Unified HMI and Map Validation

on:
  push:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '04_SOFTWARE/PLANNING/**'
      - '04_SOFTWARE/WEATHER/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '04_SOFTWARE/PLANNING/**'
      - '04_SOFTWARE/WEATHER/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  workflow_dispatch:

# Keep only the newest validation for a branch; stale commits must not consume
# duplicate Windows/Qt runners while a newer main revision is being checked.
concurrency:
  group: bluesky-pro-hmi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hmi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev libeccodes-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLUESKY_ENABLE_ECCODES=ON

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        run: ctest --test-dir build --output-on-failure


  weather-engine-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev qt6-base-dev
      - name: Configure standalone weather engine
        run: cmake -S 04_SOFTWARE/WEATHER -B build-weather -DBLUESKY_ENABLE_ECCODES=ON -DBLUESKY_ENABLE_QT_NETWORK=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build standalone weather engine
        run: cmake --build build-weather --parallel 2
      - name: Test standalone weather engine
        run: ctest --test-dir build-weather --output-on-failure
      - name: Configure integrated planning library
        run: cmake -S 04_SOFTWARE/PLANNING -B build-planning-weather -DBLUESKY_ENABLE_ECCODES=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build integrated planning weather targets
        run: cmake --build build-planning-weather --parallel 2 --target weather_engine_test weather_applicability_policy_test gfs_forecast_planner_test grib2_decoder_contract_test weather_candidate_reranking_integration_test
      - name: Test integrated planning weather targets
        run: ctest --test-dir build-planning-weather -R "(weather_engine_contract_test|weather_applicability_policy_contract|gfs_forecast_planner_contract|grib2_decoder_contract_test|weather_candidate_reranking_integration_test)" --output-on-failure


  build-hmi-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate generated map JavaScript string escaping
        shell: pwsh
        run: |
          $path = "qt/BlueSkyPRO-HMI/qml/MapTilerWebMap.qml"
          $lines = Get-Content $path
          $insideBuildHtml = $false
          $lineNumber = 0
          foreach ($line in $lines) {
            $lineNumber++
            if ($line -match "function buildHtml\(\)") { $insideBuildHtml = $true }
            if ($insideBuildHtml) {
              # A QML string ending in an odd number of backslashes before an escaped quote
              # can leak a backslash into generated JavaScript and break parsing.
              $matches = [regex]::Matches($line, '(\\+)",')
              foreach ($match in $matches) {
                if (($match.Groups[1].Value.Length % 2) -eq 1) {
                  throw "Odd trailing backslash before an escaped quote in buildHtml at line $lineNumber"
                }
              }
            }
            if ($insideBuildHtml -and $line -match '\]\s*\.join\("\\n"\)') { break }
          }
          if (-not $insideBuildHtml) { throw "Could not locate MapTilerWebMap.qml buildHtml() source" }
          $source = Get-Content $path -Raw
          if ($source -notmatch "registeredObjects:\s*\[manualGeometryBridge,\s*routeController\]") {
            throw "Map WebChannel must register the canonical geometry and route controllers."
          }
          $mainContent = Get-Content "qt/BlueSkyPRO-HMI/qml/MainContent.qml" -Raw
          $mapSource = Get-Content "qt/BlueSkyPRO-HMI/qml/MapTilerWebMap.qml" -Raw
          $routeController = Get-Content "qt/BlueSkyPRO-HMI/src/RouteController.h" -Raw
          if ($mainContent -notmatch "waypointId:\s*String\(p\.waypointId\)") {
            throw "Map route projection must preserve canonical waypoint IDs."
          }
          if ($mapSource -notmatch "editWaypointPosition\(drag\.id") {
            throw "Map drag must commit waypoint edits through RouteController."
          }
          if ($routeController -notmatch "Q_INVOKABLE bool editWaypointPosition") {
            throw "RouteController must expose canonical waypoint position editing."
          }
          if ($source -notmatch "property\s+int\s+notamSearchRadiusNm\s*:\s*20") {
            throw "MapTilerWebMap must declare the NOTAM search-radius property passed by FlightChart.ui.qml."
          }
          if ($source -match "'fill-extrusion-opacity'\s*:\s*\[") {
            throw "fill-extrusion-opacity must be a constant; MapLibre rejects data expressions for this property."
          }
          if ($source -notmatch "let terrainOn=false;") {
            throw "3D terrain must default to OFF to match the UI control."
          }
          if ($source -notmatch "notamData=\{type:'FeatureCollection',features:features\};updateNotamLegend") {
            throw "NOTAM horizontal geometry must remain visible regardless of terrain toggle state."
          }
          if ($source -notmatch "p\.sourceUpperPlaneMeters=upper;p\.terrainMinMeters=null;p\.terrainMaxMeters=null;p\.terrainSampleCount=0;p\.terrainPlaneFlat=true;p\.terrainPlaneStatus='FLAT_SOURCE_HEIGHT_PLANE'") {
            throw "NOTAM upper boundary must remain a flat plane at the source upper altitude without terrain sampling."
          }
          if ($source -notmatch "'fill-extrusion-height':\['get','renderUpperMeters'\],'fill-extrusion-opacity':0\.28") {
            throw "Expected compatible constant-opacity NOTAM extrusion layer."
          }
          if ($source -match "\\['==',\\['literal',terrainOn\\],true\\]") {
            throw "NOTAM vertical volumes must remain visible when 3D terrain is OFF."
          }
          if ($source -match "terrainPlaneFlat=false;p\\.terrainPlaneStatus='TERRAIN_OFF'") {
            throw "Turning terrain OFF must not invalidate source-defined NOTAM altitude planes."
          }
          if ($source -notmatch "'boolean',\['get','terrainPlaneFlat'\],true") {
            throw "NOTAM extrusion must require a validated flat upper plane."
          }
          if ($source -notmatch "applyTerrainPlanes\(features\)") {
            throw "NOTAM features must receive flat upper-plane validation independently of terrain rendering."
          }
          if ($source -match "RAISED_TO_HIGHEST_TERRAIN|adjustedToTerrainPeak=true") {
            throw "NOTAM ceiling must not be raised to terrain peaks."
          }
          if (-not $source.Contains("else{map.setTerrain(null);if(map.isStyleLoaded())applyNotams();}")) {
            throw "Turning terrain OFF must remove the terrain surface while preserving the current camera pitch."
          }
          if ($source -notmatch "notam-debug-open" -or $source -notmatch "NOTAM RENDER DIAGNOSTICS" -or $source -notmatch "notam-debug-refresh") {
            throw "Temporary NOTAM diagnostics panel and refresh control must be present."
          }
          if ($source -notmatch "window\.blueskyNotamSnapshot=function\(" -or $source -notmatch "qtDiagnostics:qtNotamDiagnostics" -or $source -notmatch "renderedFeatureCounts:renderedFeatureCounts") {
            throw "NOTAM diagnostics must report QML input, GeoJSON, layers and rendered feature counts."
          }
          if ($source -notmatch "mapErrors:perfDiag\.recentErrors") {
            throw "NOTAM diagnostics must include recent MapLibre rendering errors."
          }
          if ($source -notmatch "function drawNotamOverlayImpl" -or $source -notmatch "function updateNotamOverlayFallback" -or $source -notmatch "<svg id='notam-overlay'") {
            throw "NOTAM zones must have a direct SVG fallback when MapLibre returns no rendered features."
          }
          if ($source -notmatch "notamOverlayFallback:\{active:notamOverlayActive,featureCount:notamOverlayFeatureCount,drawState:notamOverlayDrawState") {
            throw "NOTAM diagnostics must report whether the SVG fallback is active and how many features it draws."
          }
          if ($source -notmatch "RECREATE_NOTAM_SOURCE_AND_LAYERS" -or $source -notmatch "verifyNotamAfterStyleReload" -or $source -notmatch "postStyleReloadCheck" -or $source -notmatch "sourceHealthError") {
            throw "NOTAM source-cache recovery must recreate the NOTAM source and layers, verify the tile manager, and report post-rebuild checks."
          }
          if ($source -notmatch "renderTrace:JSON\.parse\(JSON\.stringify\(notamRenderTrace\)\)") {
            throw "NOTAM diagnostics must expose the actual source-cache recovery trace."
          }
          Write-Host "Map NOTAM geometry visibility, terrain-state, and temporary diagnostics regression checks passed."
          
      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Install Qt MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 8469b01206bff843500592f18dcab88b13331da6
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore ecCodes vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('qt/BlueSkyPRO-HMI/vcpkg.json') }}

      - name: Install ecCodes
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          Push-Location "qt/BlueSkyPRO-HMI"
          & "$env:VCPKG_ROOT\\vcpkg.exe" install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Verify compiler and Qt kit
        shell: pwsh
        run: |
          where.exe cl
          where.exe cmake
          if (-not (Test-Path "$env:QT_ROOT_DIR\lib\Qt6Core.lib")) { throw "Qt MSVC libraries not found under QT_ROOT_DIR" }

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBLUESKY_ENABLE_ECCODES=ON -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_APPLOCAL_DEPS=ON -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime --qmldir qml build\appBlueSkyPRO.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable Windows crash dump capture
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "BlueSkyPRO-crash-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\appBlueSkyPRO.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null

      - name: Windows startup isolation matrix
        working-directory: qt/BlueSkyPRO-HMI/build
        shell: pwsh
        run: |
          $startupLog = Join-Path $env:TEMP "BlueSkyPRO-startup-diagnostic.log"
          $cases = @(
            @{ Name = "no-api-key"; Args = @(); Key = $false },
            @{ Name = "map-key-webchannel-disabled"; Args = @("--ci-disable-webchannel"); Key = $true },
            @{ Name = "map-key-webchannel-enabled"; Args = @(); Key = $true }
          )
          $failures = @()
          foreach ($case in $cases) {
            if (Test-Path $startupLog) { Remove-Item $startupLog -Force }
            if (-not $case.Key) { Remove-Item Env:BLUESKY_MAPTILER_API_KEY -ErrorAction SilentlyContinue }
            else { $env:BLUESKY_MAPTILER_API_KEY = "CI_SMOKE_TEST_KEY_NOT_VALID" }
            $stdout = "app-smoke-$($case.Name).stdout.log"
            $stderr = "app-smoke-$($case.Name).stderr.log"
            Write-Host "=== STARTUP CASE: $($case.Name) ==="
            $app = Start-Process -FilePath "appBlueSkyPRO.exe" -ArgumentList $case.Args -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) {
              $detail = "CASE $($case.Name): process exited with code $($app.ExitCode)"
              $failures += $detail
              Write-Host $detail
              Write-Host "=== stdout ==="; Get-Content $stdout -ErrorAction SilentlyContinue
              Write-Host "=== stderr ==="; Get-Content $stderr -ErrorAction SilentlyContinue
            } else {
              Stop-Process -Id $app.Id -Force
              Write-Host "CASE $($case.Name): process remained alive for 12 seconds"
            }
            if (Test-Path $startupLog) {
              Copy-Item $startupLog "app-smoke-$($case.Name)-startup.log" -Force
              Get-Content $startupLog
            } else {
              Write-Host "No startup diagnostic log was created for $($case.Name)"
            }
            Start-Sleep -Seconds 2
          }
          if ($failures.Count -gt 0) { throw ($failures -join [Environment]::NewLine) }
          Write-Host "All Windows startup isolation cases passed. Map tile authorization/rendering is not tested by this smoke check."

      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueSkyPRO-Windows-startup-diagnostics
          path: |
            D:/a/_temp/BlueSkyPRO-crash-dumps/**
            qt/BlueSkyPRO-HMI/build/app-smoke-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package Windows application ZIP
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "build"
          $stageDir = Join-Path $env:RUNNER_TEMP "BlueSkyPRO-Windows-x64"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -Path (Join-Path $buildDir "*") -Destination $stageDir -Recurse -Force

          $required = @(
            (Join-Path $stageDir "appBlueSkyPRO.exe"),
            (Join-Path $stageDir "QtWebEngineProcess.exe"),
            (Join-Path $stageDir "platforms\qwindows.dll")
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required runtime file missing from package: $file" }
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "BlueSkyPRO-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          $zip = Get-Item $zipPath
          if ($zip.Length -lt 1MB) { throw "Packaged ZIP is unexpectedly small ($($zip.Length) bytes)" }
          Write-Host "Created $($zip.FullName) ($($zip.Length) bytes)"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueSkyPRO-Windows-x64
          path: BlueSkyPRO-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30


  verify:
    name: Unified final verification
    if: always()
    needs:
      - build-hmi
      - build-hmi-windows
      - weather-engine-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux tests and Windows build/map checks to pass
        env:
          LINUX_RESULT: ${{ needs.build-hmi.result }}
          WINDOWS_RESULT: ${{ needs.build-hmi-windows.result }}
          WEATHER_RESULT: ${{ needs.weather-engine-linux.result }}
        run: |
          echo "Linux HMI and ctest: ${LINUX_RESULT}"
          echo "Windows HMI, map regressions, smoke test and package: ${WINDOWS_RESULT}"
          echo "Standalone and integrated weather engine tests: ${WEATHER_RESULT}"
          test "${LINUX_RESULT}" = "success"
          test "${WINDOWS_RESULT}" = "success"
          test "${WEATHER_RESULT}" = "success"

name: BlueSky PRO HMI Qt Build

on:
  push:
    branches:
      - feat/hmi-controlled-cleanup-001
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  pull_request:
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  workflow_dispatch:

jobs:
  build-hmi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

name: BlueSky PRO HMI Qt Build

on:
  push:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-hmi.yml'
  workflow_dispatch:

jobs:
  build-hmi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev libeccodes-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLUESKY_ENABLE_ECCODES=ON -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_APPLOCAL_DEPS=ON -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake" -DBLUESKY_ENABLE_ECCODES=ON

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        run: ctest --test-dir build --output-on-failure

  build-hmi-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 8469b01206bff843500592f18dcab88b13331da6
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics

      - name: Install ecCodes
        shell: pwsh
        run: .\\vcpkg\\vcpkg.exe install --triplet x64-windows --manifest-root qt/BlueSkyPRO-HMI

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime and package
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          $package = Join-Path $PWD "build/package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/appBlueSkyPRO.exe" $package
          windeployqt --release --compiler-runtime --qmldir qml --dir $package (Join-Path $package "appBlueSkyPRO.exe")
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath "build/BlueSkyPRO-Windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BlueSkyPRO-Windows-x64
          path: qt/BlueSkyPRO-HMI/build/BlueSkyPRO-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

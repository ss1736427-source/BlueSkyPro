name: BlueSky PRO Windows Map Build

on:
  push:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  workflow_dispatch:

jobs:
  build-hmi-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate generated map JavaScript string escaping
        shell: pwsh
        run: |
          $path = "qt/BlueSkyPRO-HMI/qml/MapTilerWebMap.qml"
          $lines = Get-Content $path
          $insideBuildHtml = $false
          $lineNumber = 0
          foreach ($line in $lines) {
            $lineNumber++
            if ($line -match "function buildHtml\(\)") { $insideBuildHtml = $true }
            if ($insideBuildHtml) {
              # A QML string ending in an odd number of backslashes before an escaped quote
              # can leak a backslash into generated JavaScript and break parsing.
              $matches = [regex]::Matches($line, '(\\+)",')
              foreach ($match in $matches) {
                if (($match.Groups[1].Value.Length % 2) -eq 1) {
                  throw "Odd trailing backslash before an escaped quote in buildHtml at line $lineNumber"
                }
              }
            }
            if ($insideBuildHtml -and $line -match '\]\s*\.join\("\\n"\)') { break }
          }
          if (-not $insideBuildHtml) { throw "Could not locate MapTilerWebMap.qml buildHtml() source" }
          $source = Get-Content $path -Raw
          if ($source -match "'fill-extrusion-opacity'\s*:\s*\[") {
            throw "fill-extrusion-opacity must be a constant; MapLibre rejects data expressions for this property."
          }
          if ($source -notmatch "let terrainOn=false;") {
            throw "3D terrain must default to OFF to match the UI control."
          }
          if ($source -notmatch "if\(!terrainOn\)\{notamData=\{type:'FeatureCollection',features:features\};updateNotamLegend") {
            throw "NOTAM horizontal geometry must remain visible in 2D when terrain is OFF."
          }
          if ($source -notmatch "'fill-extrusion-height':\['get','upperMeters'\],'fill-extrusion-opacity':0\.28") {
            throw "Expected compatible constant-opacity NOTAM extrusion layer."
          }
          if ($source -notmatch "'boolean',\['get','terrainPlaneFlat'\],false") {
            throw "AGL NOTAM extrusion must be gated on a validated terrain plane."
          }
          if ($source -notmatch "if\(terrainOn\)\{if\(map\.isStyleLoaded\(\)\)\{enableTerrain\(\);applyTerrainPlanes\(notamData\.features\|\|\[\]\);") {
            throw "Enabling terrain must initiate AGL terrain-plane validation."
          }
          if ($source -notmatch "if\(!terrainOn&&map\.getTerrain\(\)\)map\.setTerrain\(null\)") {
            throw "Terrain must be disabled after NOTAM terrain sampling when the UI toggle is OFF."
          }
          if ($source -notmatch "notam-debug-open" -or $source -notmatch "NOTAM RENDER DIAGNOSTICS" -or $source -notmatch "notam-debug-refresh") {
            throw "Temporary NOTAM diagnostics panel and refresh control must be present."
          }
          if ($source -notmatch "window\.blueskyNotamSnapshot=function\(" -or $source -notmatch "qtDiagnostics:qtNotamDiagnostics" -or $source -notmatch "renderedFeatureCounts:renderedFeatureCounts") {
            throw "NOTAM diagnostics must report QML input, GeoJSON, layers and rendered feature counts."
          }
          if ($source -notmatch "mapErrors:perfDiag\.recentErrors") {
            throw "NOTAM diagnostics must include recent MapLibre rendering errors."
          }
          Write-Host "Map NOTAM geometry visibility, terrain-state, and temporary diagnostics regression checks passed."
          
      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Install Qt MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify compiler and Qt kit
        shell: pwsh
        run: |
          where.exe cl
          where.exe cmake
          if (-not (Test-Path "$env:QT_ROOT_DIR\lib\Qt6Core.lib")) { throw "Qt MSVC libraries not found under QT_ROOT_DIR" }

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir qml build\appBlueSkyPRO.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows application startup smoke test with MapTiler path enabled
        working-directory: qt/BlueSkyPRO-HMI/build
        shell: pwsh
        run: |
          # A deliberately invalid test key activates the same QML/WebChannel path without exposing a real API key.
          $env:BLUESKY_MAPTILER_API_KEY = "CI_SMOKE_TEST_KEY_NOT_VALID"
          $startupLog = Join-Path $env:TEMP "BlueSkyPRO-startup-diagnostic.log"
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "appBlueSkyPRO.exe" -PassThru -RedirectStandardOutput app-smoke.stdout.log -RedirectStandardError app-smoke.stderr.log
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "=== stdout ==="
            Get-Content app-smoke.stdout.log -ErrorAction SilentlyContinue
            Write-Host "=== stderr ==="
            Get-Content app-smoke.stderr.log -ErrorAction SilentlyContinue
            Write-Host "=== BlueSky PRO startup diagnostic ==="
            if (Test-Path $startupLog) {
              Get-Content $startupLog
            } else {
              Write-Host "Startup diagnostic log was not created; failure may have occurred before main() logging started."
            }
            throw "appBlueSkyPRO.exe exited during MapTiler-enabled startup smoke test (code $($app.ExitCode))"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "MapTiler-enabled startup smoke test passed: process remained alive for 15 seconds. This checks startup stability, not successful map tile authorization or visual rendering."

      - name: Upload Windows application bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueSkyPRO-Windows-Map-Review
          path: qt/BlueSkyPRO-HMI/build/
          if-no-files-found: error
          retention-days: 7

name: BlueSky PRO Windows Map Build

on:
  push:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'qt/BlueSkyPRO-HMI/**'
      - '.github/workflows/bluesky-pro-windows-map-check.yml'
  workflow_dispatch:

jobs:
  build-hmi-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Install Qt MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtlocation qtpositioning qtwebchannel qtwebengine'

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify compiler and Qt kit
        shell: pwsh
        run: |
          where.exe cl
          where.exe cmake
          Write-Host "Startup smoke test passed: process remained alive for 8 seconds. This does not verify visual map rendering."
          if (-not (Test-Path "$env:QT_ROOT_DIR\lib\Qt6Core.lib")) { throw "Qt MSVC libraries not found under QT_ROOT_DIR" }

      - name: Configure
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        working-directory: qt/BlueSkyPRO-HMI
        run: cmake --build build --parallel

      - name: Test
        working-directory: qt/BlueSkyPRO-HMI
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        working-directory: qt/BlueSkyPRO-HMI
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir qml build\appBlueSkyPRO.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows application startup smoke test
        working-directory: qt/BlueSkyPRO-HMI/build
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "appBlueSkyPRO.exe" -PassThru -RedirectStandardOutput app-smoke.stdout.log -RedirectStandardError app-smoke.stderr.log
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) {
            Get-Content app-smoke.stdout.log -ErrorAction SilentlyContinue
            Get-Content app-smoke.stderr.log -ErrorAction SilentlyContinue
            throw "appBlueSkyPRO.exe exited during startup smoke test (code $($app.ExitCode))"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "Startup smoke test passed: process remained alive for 8 seconds. This does not verify visual map rendering."

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlueSkyPRO-Windows-Map-Review
          path: qt/BlueSkyPRO-HMI/build/
          if-no-files-found: error
          retention-days: 7

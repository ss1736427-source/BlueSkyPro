name: BlueSky Autopilot Adapter

on:
  workflow_dispatch:
  push:
    paths:
      - '04_SOFTWARE/AUTOPILOT_ADAPTER/**'
      - '04_SOFTWARE/PLANNING/model/**'
      - '03_FLEET/BLUESKY_*ADAPTER*'
      - '04_SOFTWARE/INSURANCE/**'
      - '.github/workflows/autopilot-adapter.yml'
  pull_request:
    paths:
      - '04_SOFTWARE/AUTOPILOT_ADAPTER/**'
      - '04_SOFTWARE/PLANNING/model/**'
      - '04_SOFTWARE/INSURANCE/**'
      - '03_FLEET/BLUESKY_*ADAPTER*'
      - '.github/workflows/autopilot-adapter.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate adapter repository consistency
        run: python 04_SOFTWARE/AUTOPILOT_ADAPTER/contract/validate_adapter_chain.py

      - name: Configure
        run: cmake -S 04_SOFTWARE/AUTOPILOT_ADAPTER -B build/autopilot-adapter -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/autopilot-adapter --config Release --parallel

      - name: Test verification evidence recorder
        run: python -m unittest discover -s 04_SOFTWARE/AUTOPILOT_ADAPTER/verification -p 'test_*.py'

      - name: Test
        run: |
          ./build/autopilot-adapter/measurement_instrument_adapter_baseline_test
          ctest --test-dir build/autopilot-adapter --output-on-failure -E measurement_instrument_adapter_baseline_test
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core -I04_SOFTWARE/PLANNING 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_007_direct_result_evidence_bridge.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/autopilot_adapter_baseline.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/c2_interface_baseline.cpp -o build/ph4_int_007_bridge
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_007_evidence_session_test.py build/ph4_int_007_bridge
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_009_flight_record_producer_test.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_009_flight_record_producer.cpp -o build/ph4_int_009_producer
          ./build/ph4_int_009_producer
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_010_operational_evidence_bridge.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_009_flight_record_producer.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/autopilot_adapter_baseline.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/c2_interface_baseline.cpp -o build/ph4_int_010_bridge
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_010_evidence_session_test.py build/ph4_int_010_bridge
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_011_flight_record_lifecycle_bridge.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_009_flight_record_producer.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_011_flight_record_lifecycle.cpp -o build/ph4_int_011_lifecycle_bridge
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_011_evidence_session_test.py build/ph4_int_011_lifecycle_bridge
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_012_operational_execution_bridge.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_009_flight_record_producer.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_011_flight_record_lifecycle.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/autopilot_adapter_baseline.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/c2_interface_baseline.cpp -o build/ph4_int_012_bridge
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_012_evidence_session_test.py build/ph4_int_012_bridge
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_013_heterogeneous_adapter_conformance.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/autopilot_adapter_baseline.cpp -o build/ph4_int_013_conformance
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_013_evidence_session_test.py build/ph4_int_013_conformance
          c++ -std=c++20 -I04_SOFTWARE/AUTOPILOT_ADAPTER/core 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_014_sil_execution_source_main.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_014_sil_execution_source.cpp 04_SOFTWARE/AUTOPILOT_ADAPTER/core/autopilot_adapter_baseline.cpp -o build/ph4_int_014_sil
          ./build/ph4_int_014_sil build/ph4_int_014_events.jsonl
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/core/ph4_int_014_sil_execution_evidence_test.py build/ph4_int_014_sil
          ./build/autopilot-adapter/ph4_int_017_mission_execution_readback_correlation_fixture
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/verification/ph4_int_017_mission_execution_readback_correlation_test.py
          ./build/autopilot-adapter/ph4_int_018_negative_path_mission_correlation_fixture
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/verification/ph4_int_018_negative_path_mission_correlation_test.py
          ./build/autopilot-adapter/ph4_int_019_configuration_lifecycle_fixture
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/verification/ph4_int_019_configuration_lifecycle_test.py
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/verification/ph4_int_020_c2_lifecycle_correlation_test.py
          python 04_SOFTWARE/AUTOPILOT_ADAPTER/verification/ph4_int_021_navigation_lifecycle_correlation_test.py

name: BlueSky Planning Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '04_SOFTWARE/PLANNING/**'
      - '03_FLEET/BLUESKY_*ADAPTER*'
      - '.github/workflows/planning-benchmark.yml'
      - '.gitignore'
      - '**/build/**'
      - '**/build_clean/**'
  pull_request:
    paths:
      - '04_SOFTWARE/PLANNING/**'
      - '03_FLEET/BLUESKY_*ADAPTER*'
      - '.github/workflows/planning-benchmark.yml'
      - '.gitignore'
      - '**/build/**'
      - '**/build_clean/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate adapter repository consistency
        run: python 04_SOFTWARE/AUTOPILOT_ADAPTER/contract/validate_adapter_chain.py

      - name: Configure
        run: cmake -S 04_SOFTWARE/PLANNING -B build/planning -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/planning --config Release --parallel

      - name: Test
        run: ctest --test-dir build/planning --output-on-failure

      - name: Print representative MT-01 simulation metrics
        run: ./build/planning/mt01_t01_representative_simulation_test

      - name: Validate Virtual Flight JSON result contract
        run: |
          ./build/planning/mt01_t01_representative_simulation_test --json > build/planning/virtual-flight-sim-001.json
          python -c "import json,pathlib; d=json.loads(pathlib.Path('build/planning/virtual-flight-sim-001.json').read_text()); assert d['messageType']=='planning.result'; assert d['verification']['releaseStatus']=='BLOCKED'; assert d['verification']['verified'] is False; assert d['simulationAcceptance']=='PASS'; assert d['operationalStatus']=='BLOCKED_NOT_EXECUTED'; assert len(d['routeCoordinates']) >= 2; assert d['environment']['notamId']=='SIM-NOTAM-001'; print('virtual_flight_json_contract=PASS; route_points='+str(len(d['routeCoordinates'])))"

# CI trigger verification for the current main baseline.
